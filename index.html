<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOW</title>
    <style>
        body{
            background-color: rgb(255,207,224);
        }
        *{
            margin: 0;
            padding: 0;
        }
        .tt{
            height: 100px;
            color:white;
            background-color:rgb(245,152,185);
            text-align: center;
            font-size: 70px;
        }
        .card{
            
            overflow: hidden;
            background-color: red;
            width: 340px;
            height: 160px;
            border-radius: 30px;
            margin:0 auto;
            margin-top: 130px;
            box-shadow: 10px 10px 30px rgb(0,0,0,0.5);
        }
        .up{
            display: flex;
            background-color:rgb(240,251,255);
            height: 60px;
            padding-left: 15px;
            align-items: center;
        }
        .circle{
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
            margin:0 2.5px;
        }
        .c3{
            background-color: crimson;
        }
        .text{
            padding-left: 10px;
            font-size: 20px;
        }
        .down{
            font-size: 30px;
            line-height: 85px;
            padding-left: 30px;
            height: 100px;
            background-color: rgb(190,219,233);
        }

    </style>
</head>
<body>
   <div class="tt">
    <marquee>标签墙</marquee>
   </div>

   <div class="card">
    <div class="up">
        <div class="circle" style="background-color: aquamarine;"></div>
        <div class="circle" style="background-color:rgb(46, 107, 221)"></div>
        <div class="circle c3"></div>
        <div class="text"><i>温馨提示</i></div>
    </div>

    <div class="down">所有烦恼都消失</div>
   </div>
</body>
</html>
